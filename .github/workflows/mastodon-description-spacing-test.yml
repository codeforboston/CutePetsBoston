name: Mastodon Description Spacing Test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/177-description-spacing
    paths:
      - .github/workflows/mastodon-description-spacing-test.yml
      - manual_testing/mastodon_description_spacing_test.py

permissions:
  contents: read

concurrency:
  group: mastodon-description-spacing-test
  cancel-in-progress: false

jobs:
  live-spacing-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: pip install beautifulsoup4==4.14.3 'pydantic>=2,<3' requests==2.33.1 Mastodon.py==2.2.1 pytest
      - name: Run RescueGroups regression tests
        run: python -m pytest tests/test_rescue_groups.py -q
      - name: Preview test captions
        run: python manual_testing/mastodon_description_spacing_test.py --dry-run
      - name: Post and verify on Mastodon test account
        id: live
        env:
          MASTODON_TEST_TOKEN: ${{ secrets.MASTODON_TEST_TOKEN }}
        run: python manual_testing/mastodon_description_spacing_test.py
      - name: Save live test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mastodon-177-${{ steps.live.outputs.post_id || 'no-post' }}
          path: mastodon-spacing-result.json
          if-no-files-found: ignore
