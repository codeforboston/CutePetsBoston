name: RescueGroups API check

on:
  push:
    # We are doing this for testing purposes, but when we start posting, we should remove this line
    branches:
      [mw/test-workflow, j2_test, master, add-crontab, instagram-integration, daniels-local]
  workflow_dispatch:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"

jobs:
  call-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --break-system-packages -r requirements.txt

      - name: Restore Instagram session
        env:
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
        run: echo "$INSTAGRAM_SESSION" > ig_session.json

      - name: Call RescueGroups API
        env:
          CUTEPETSBOSTON_RESCUEGROUPS_API_KEY: ${{ secrets.CUTEPETSBOSTON_RESCUEGROUPS_API_KEY }}
          INSTAGRAM_HANDLE: ${{ secrets.INSTAGRAM_HANDLE }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          INSTAGRAM_PROXY: ${{ secrets.INSTAGRAM_PROXY }}
        run: python ./main.py
