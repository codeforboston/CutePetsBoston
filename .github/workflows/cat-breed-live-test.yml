name: Temporary cat breed live test

on:
  push:
    branches: [codex/cat-breed-hashtags-168]
    paths: [.github/workflows/cat-breed-live-test.yml]

permissions:
  contents: read

concurrency:
  group: cat-breed-live-test-168
  cancel-in-progress: false

jobs:
  post-one-cat:
    if: github.event.head_commit.message == 'Live test cat breed hashtags (#168)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install focused test and posting dependencies
        run: python -m pip install requests 'pydantic>=2,<3' pytest
      - name: Check Bluesky formatting
        run: python -m pytest tests/test_bluesky.py -q
      - name: Publish and verify one currently adoptable cat
        env:
          CUTEPETSBOSTON_RESCUEGROUPS_API_KEY: ${{ secrets.CUTEPETSBOSTON_RESCUEGROUPS_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: python manual_testing/bluesky_cat_manual_test.py --publish
      - name: Save the post link and verification result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cat-breed-live-result
          path: cat-breed-live-result.json
          if-no-files-found: ignore
          retention-days: 7
