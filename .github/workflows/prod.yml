name: Prod Account Post

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"

permissions:
      actions: read
      contents: write

# Limits to executing one workflow in a concurrency group at any time
# Will queue 1 PENDING workflow run. New incoming runs cancel & replace the pending run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: single

jobs:
  run-cute-pets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Checkout gh-pages (redirect mapping)
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: pip install --break-system-packages -r requirements.txt

      - name: Get Previous Run ID
        continue-on-error: true 
        id: get_id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetches the ID of this branch's last completed run for the current workflow
          PREVIOUS_RUN_ID=$(gh run list \
          --branch "${{ github.ref_name }}" \
          --workflow "${{ github.workflow }}" \
          --status success \
          --limit 1 \
          --json databaseId \
          --jq '.[0].databaseId')
          echo "previous_run_id=$PREVIOUS_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download previous database artifact
        uses: actions/download-artifact@v8
        with:
          name: database.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.get_id.outputs.previous_run_id }}
        continue-on-error: true 

      - name: Call RescueGroups API
        env:
          CUTEPETSBOSTON_RESCUEGROUPS_API_KEY: ${{ secrets.CUTEPETSBOSTON_RESCUEGROUPS_API_KEY }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_PAGE_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_PAGE_ACCESS_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          APP_ENV: prod
          REDIRECTS_JSON_PATH: gh-pages/docs/redirects.json
        run: python ./main.py

      - name: Commit redirect mapping
        if: '!cancelled()'
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/redirects.json
          if git diff --cached --quiet; then
            echo "No redirect changes to commit."
          else
            git pull --rebase origin gh-pages
            git commit -m "Add redirect mapping for latest posted pet"
            git push origin HEAD:gh-pages
          fi

      - name: Upload database artifact
        uses: actions/upload-artifact@v7
        with:
          path: database.json
          retention-days: 14
          archive: false

      - name: Upload API Log artifact
        if: '!cancelled()' #This ensures this step runs even if the previous steps failed only if manually cancelled it doesnt run
        uses: actions/upload-artifact@v7
        with:
          path: cutepets.log
          retention-days: 90
          archive: false
