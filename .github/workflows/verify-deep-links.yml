name: Verify Deep Links (manual)

# Helper to validate pet deep-link reconstruction end-to-end: pulls the live
# RescueGroups API, finds a Sterling/SmallDog pet, reconstructs the deep link,
# and posts it to the Bluesky TEST account.
#
# Runs on push to the feature branch (workflow_dispatch only works once a
# workflow is on the default branch, so push lets us test before merge).
on:
  push:
    branches: [deep-link-reconstruction]
  workflow_dispatch:
    inputs:
      max_pulls:
        description: "Max random API pulls while searching"
        type: string
        default: "8"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        # The verification script only needs requests (Bluesky poster + API client).
        run: pip install --break-system-packages requests

      - name: Find pet, reconstruct link, post to Bluesky test
        env:
          CUTEPETSBOSTON_RESCUEGROUPS_API_KEY: ${{ secrets.CUTEPETSBOSTON_RESCUEGROUPS_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_TEST_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_TEST_PASSWORD }}
        run: |
          python manual_testing/verify_deep_links.py --post --max-pulls "${{ inputs.max_pulls || '8' }}"
